<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="streamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" fill="url(#bgGrad)"/>

  <!-- Fluid Cyber Waves -->
  <path d="M 0 160 C 200 130, 380 200, 560 170 C 740 140, 880 180, 1000 150 L 1000 240 L 0 240 Z" fill="url(#wave1Grad)"/>
  <path d="M 0 185 C 240 155, 420 220, 620 185 C 800 150, 900 195, 1000 175 L 1000 240 L 0 240 Z" fill="url(#wave2Grad)"/>

  <!-- Audio Waves & Broadcast Icon -->
  <g transform="translate(500, 60)" text-anchor="middle" filter="url(#streamGlow)">
    <!-- Broadcast Tower / Signal Antenna -->
    <circle cx="0" cy="-4" r="5.5" fill="#22d3ee"/>
    <!-- Concentric Broadcast Waves -->
    <path d="M -11 -12 C -17 -6, -17 0, -11 5" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 11 -12 C 17 -6, 17 0, 11 5" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -18 -18 C -27 -9, -27 4, -18 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 18 -18 C 27 -9, 27 4, 18 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Equalizer Bars Below -->
    <rect x="-14" y="16" width="4" height="8" rx="1" fill="#38bdf8"/>
    <rect x="-7" y="13" width="4" height="11" rx="1" fill="#22d3ee"/>
    <rect x="0" y="10" width="4" height="14" rx="1" fill="#ffffff"/>
    <rect x="7" y="13" width="4" height="11" rx="1" fill="#22d3ee"/>
    <rect x="14" y="16" width="4" height="8" rx="1" fill="#38bdf8"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    ZYRO STREAMING BOT
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#bae6fd" letter-spacing="0.5">
    24/7 Continuous Streaming Presence • Voice Station Daemon
  </text>
</svg>
